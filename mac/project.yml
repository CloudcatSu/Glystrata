name: Glystrata
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  GlystrataCore:
    path: .
targets:
  Glystrata:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: GlystrataCore
        product: GlystrataCore
    # Written out by XcodeGen on every build; Xcode adds the INFOPLIST_KEY_ settings below to it.
    info:
      path: .build/Info.plist
      properties:
        # The app translates its own text at run time and ships no .lproj folders; without this
        # the menus macOS supplies (File, Edit, Undo, Quit…) stay in English on every system.
        CFBundleAllowMixedLocalizations: true
        # Offered in Finder's "Open With" and accepted on the Dock icon, without taking these
        # types over from whatever the user already opens them with.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: YAML
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.yaml]
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
          # Opening one shows the snapshot history of the document it sits beside. On Windows
          # these files only have an icon.
          - CFBundleTypeName: Glystrata Snapshot
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            CFBundleTypeIconFile: SnapshotFile
            LSItemContentTypes: [com.firewatersmithy.glystrata.snapshot]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.firewatersmithy.glystrata.snapshot
            UTTypeDescription: Glystrata Snapshot
            UTTypeConformsTo: [public.json]
            UTTypeIconFile: SnapshotFile
            UTTypeTagSpecification:
              public.filename-extension: [gss]
          # The private type that carries a tab or group being dragged inside the window.
          - UTTypeIdentifier: com.firewatersmithy.glystrata.drag-item
            UTTypeDescription: Glystrata drag item
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_NAME: Glystrata
        # Provisional: settle the identifier before the first public release.
        PRODUCT_BUNDLE_IDENTIFIER: com.firewatersmithy.Glystrata
        MARKETING_VERSION: 1.2.3
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Glystrata
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
        # Ad-hoc signing: runs on the Mac that built it, which is all a personal build needs.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # Snapshot sidecars are written beside the user's documents, which a sandbox would not allow
        # without a per-folder permission flow.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
